
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--color-background-tertiary,#f5f5f3);color:var(--color-text-primary,#111);min-height:100vh}
.app{display:flex;flex-direction:column;height:100vh;min-height:600px}
.topbar{background:var(--color-background-primary,#fff);border-bottom:0.5px solid var(--color-border-tertiary,rgba(0,0,0,.12));padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar-brand{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.topbar-brand small{display:block;font-size:10px;font-weight:400;color:var(--color-text-secondary,#555);letter-spacing:.06em;text-transform:uppercase}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
label{font-size:12px;color:var(--color-text-secondary)}
select,input[type=number]{font-size:12px;padding:4px 8px;border:0.5px solid var(--color-border-secondary,rgba(0,0,0,.2));border-radius:6px;background:var(--color-background-secondary,#f5f5f3);color:var(--color-text-primary);height:30px}
.btn{font-size:12px;padding:4px 12px;border:0.5px solid var(--color-border-secondary,rgba(0,0,0,.2));border-radius:6px;background:var(--color-background-secondary,#f5f5f3);color:var(--color-text-primary);cursor:pointer;height:30px;display:flex;align-items:center;gap:4px}
.btn:hover{background:var(--color-background-tertiary,#eee)}
.stats-bar{background:var(--color-background-secondary,#f5f5f3);border-bottom:0.5px solid var(--color-border-tertiary,rgba(0,0,0,.1));padding:6px 16px;display:flex;gap:20px}
.stat-item{display:flex;flex-direction:column}
.stat-label{font-size:10px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.06em}
.stat-value{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.main{display:flex;flex:1;overflow:hidden}
.map-wrap{flex:1;position:relative;overflow:hidden;background:#1a2438}
svg.map{display:block;width:100%;height:100%}
.info-panel{width:260px;background:var(--color-background-primary,#fff);border-left:0.5px solid var(--color-border-tertiary,rgba(0,0,0,.12));overflow-y:auto;font-size:12px;padding:12px}
.info-panel h3{font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.07em;margin:12px 0 6px}
.info-panel h3:first-child{margin-top:0}
.id-badge{font-family:monospace;font-size:11px;color:#60a5fa;background:#1a2438;border-radius:4px;padding:4px 8px;word-break:break-all}
.attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.attr-cell{background:var(--color-background-secondary,#f5f5f3);border-radius:6px;padding:6px 8px}
.attr-cell .ak{font-size:10px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em}
.attr-cell .av{font-size:12px;font-weight:500;margin-top:1px}
.score-row{margin-bottom:5px}
.score-row .sr-top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px}
.score-row .sr-label{color:var(--color-text-secondary)}
.score-row .sr-val{font-weight:500}
.score-bar-bg{height:4px;background:var(--color-background-secondary,#eee);border-radius:2px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:2px}
.mask-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.mask-cell{background:var(--color-background-secondary,#f5f5f3);border-radius:4px;padding:4px 8px;display:flex;justify-content:space-between;font-size:11px}
.mask-key{color:var(--color-text-secondary)}
.mask-val{color:#60a5fa;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:10px;background:var(--color-background-secondary,#eee);border-radius:4px;padding:2px 6px;border:0.5px solid var(--color-border-tertiary,rgba(0,0,0,.1));color:var(--color-text-secondary)}
.legend{background:var(--color-background-primary,#fff);border-top:0.5px solid var(--color-border-tertiary,rgba(0,0,0,.1));padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.legend-title{font-size:11px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.06em}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--color-text-secondary)}
.legend-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.legend-grad{width:80px;height:10px;border-radius:3px}
.close-btn{background:none;border:none;cursor:pointer;color:var(--color-text-secondary);font-size:16px;float:right;line-height:1}
.district-label{pointer-events:none;font-size:8px;font-weight:500;fill:rgba(255,255,255,.55);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.8)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-brand">Kosovo cadastral demo <small>synthetic · not real data</small></div>
    <div class="controls">
      <label>Seed <input type="number" id="seedInput" value="918273" style="width:90px"></label>
      <label>Grid
        <select id="gridSel">
          <option value="22">22×22</option>
          <option value="28" selected>28×28</option>
          <option value="34">34×34</option>
          <option value="40">40×40</option>
        </select>
      </label>
      <label>Color
        <select id="colorSel">
          <option value="landUse">Land use</option>
          <option value="cropType">Crop type</option>
          <option value="district">District</option>
          <option value="farmScore">Farm score</option>
          <option value="harvestHealth">Harvest health</option>
          <option value="soilQuality">Soil quality</option>
        </select>
      </label>
      <button class="btn" id="regenBtn">↺ Regenerate</button>
      <button class="btn" id="exportBtn">↓ GeoJSON</button>
    </div>
  </div>
  <div class="stats-bar">
    <div class="stat-item"><span class="stat-label">Parcels</span><span class="stat-value" id="st-total">—</span></div>
    <div class="stat-item"><span class="stat-label">Farmland</span><span class="stat-value" id="st-farm">—</span></div>
    <div class="stat-item"><span class="stat-label">Avg health</span><span class="stat-value" id="st-health">—</span></div>
    <div class="stat-item"><span class="stat-label">Total area</span><span class="stat-value" id="st-area">—</span></div>
    <div class="stat-item"><span class="stat-label">Districts</span><span class="stat-value">7</span></div>
  </div>
  <div class="main">
    <div class="map-wrap">
      <svg class="map" id="mapSvg" viewBox="0 0 700 520" preserveAspectRatio="xMidYMid meet">
        <rect width="700" height="520" fill="#1a2438"/>
        <g id="parcelsG"></g>
        <path id="borderPath" fill="none" stroke="#60a5fa" stroke-width="1.2" opacity="0.7"/>
        <g id="labelsG"></g>
      </svg>
    </div>
    <div class="info-panel" id="infoPanel" style="display:none">
      <button class="close-btn" id="closeBtn">×</button>
      <div id="infoContent"></div>
    </div>
  </div>
  <div class="legend">
    <span class="legend-title" id="legTitle">Land use</span>
    <div id="legItems" style="display:flex;gap:10px;flex-wrap:wrap"></div>
  </div>
</div>

<script>
const KOS = [
  [20.056,43.012],[20.115,43.095],[20.215,43.168],[20.390,43.230],
  [20.570,43.270],[20.760,43.265],[20.920,43.248],[21.055,43.175],
  [21.185,43.105],[21.325,43.025],[21.475,42.940],[21.585,42.875],
  [21.665,42.820],[21.748,42.770],[21.788,42.700],[21.792,42.600],
  [21.772,42.500],[21.735,42.390],[21.665,42.280],[21.575,42.200],
  [21.485,42.090],[21.385,42.010],[21.255,41.970],[21.125,41.942],
  [20.985,41.892],[20.865,41.855],[20.735,41.860],[20.625,41.882],
  [20.535,41.942],[20.465,42.022],[20.425,42.105],[20.382,42.195],
  [20.332,42.285],[20.272,42.375],[20.215,42.465],[20.152,42.555],
  [20.098,42.645],[20.062,42.732],[20.042,42.820],[20.040,42.912],
  [20.048,42.972],[20.056,43.012]
];

const DISTRICTS = [
  {name:"Pristina", center:[21.166,42.668]},
  {name:"Prizren",  center:[20.740,42.215]},
  {name:"Peja",     center:[20.289,42.660]},
  {name:"Mitrovica",center:[20.866,42.885]},
  {name:"Ferizaj",  center:[21.155,42.372]},
  {name:"Gjilan",   center:[21.465,42.462]},
  {name:"Gjakova",  center:[20.432,42.385]},
];

const DCROP = {
  Pristina:  ["wheat","corn","vegetables","beans"],
  Prizren:   ["vineyard","orchard","wheat","vegetables"],
  Peja:      ["corn","potato","pasture","wheat"],
  Mitrovica: ["wheat","barley","potato","fallow"],
  Ferizaj:   ["wheat","corn","beans","barley"],
  Gjilan:    ["corn","potato","vegetables","wheat"],
  Gjakova:   ["vineyard","orchard","wheat","corn"],
};

const LU_COLORS = {
  farmland:"#6abf5e",pasture:"#93d467",orchard:"#f5a623",
  vineyard:"#a855f7",fallow:"#c4a65a",forest_edge:"#2d7d2d",mixed:"#56a097"
};
const CT_COLORS = {
  wheat:"#f5c842",corn:"#e8943a",barley:"#d4b96a",potato:"#a8855a",
  beans:"#78b87a",vegetables:"#48aa48",orchard:"#f5a623",vineyard:"#a855f7",pasture:"#90d490"
};
const DI_COLORS = {
  Pristina:"#4a90d9",Prizren:"#e67e22",Peja:"#2ecc71",
  Mitrovica:"#9b59b6",Ferizaj:"#e74c3c",Gjilan:"#1abc9c",Gjakova:"#f39c12"
};

function mkRng(seed) {
  let s = seed | 0;
  return () => {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = t + Math.imul(t ^ (t >>> 7), 61 | t) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function pip([x,y], poly) {
  let inside = false;
  for (let i=0,j=poly.length-1;i<poly.length;j=i++) {
    const [xi,yi]=poly[i],[xj,yj]=poly[j];
    if ((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
  }
  return inside;
}

function segX([x1,y1],[x2,y2],[x3,y3],[x4,y4]) {
  const d=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
  if (Math.abs(d)<1e-12) return null;
  const t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/d;
  return [x1+t*(x2-x1),y1+t*(y2-y1)];
}

function clipSH(subj, clip) {
  let out = subj.slice();
  for (let c=0;c<clip.length;c++) {
    if (!out.length) return [];
    const inp=out; out=[];
    const a=clip[c],b=clip[(c+1)%clip.length];
    const ins=([px,py])=>(b[0]-a[0])*(py-a[1])-(b[1]-a[1])*(px-a[0])<=0;
    for (let i=0;i<inp.length;i++) {
      const cur=inp[i],prv=inp[(i+inp.length-1)%inp.length];
      const cI=ins(cur),pI=ins(prv);
      if (cI){if(!pI){const x=segX(prv,cur,a,b);if(x)out.push(x);}out.push(cur);}
      else if(pI){const x=segX(prv,cur,a,b);if(x)out.push(x);}
    }
  }
  return out;
}

function centroid(pts) {
  let cx=0,cy=0;
  pts.forEach(([x,y])=>{cx+=x;cy+=y;});
  return [cx/pts.length,cy/pts.length];
}

function polyArea(pts) {
  let a=0;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++) a+=pts[j][0]*pts[i][1]-pts[i][0]*pts[j][1];
  return Math.abs(a)/2;
}

function getMasks(lng,lat,rng) {
  const fx=(lng-20.0)/1.8,fy=(lat-41.8)/1.5;
  const cl=(v)=>Math.min(1,Math.max(0,v));
  return {
    farmland:cl(0.3+0.35*Math.sin(fx*4.2+1.1)*Math.cos(fy*3.7+0.8)+0.2*Math.sin(fx*8+fy*6)+rng()*0.1),
    density: cl(0.75-Math.hypot(fx-0.5,fy-0.5)*0.52+Math.sin(fx*6)*0.1+rng()*0.15),
    health:  cl(0.4+0.3*Math.cos(fx*5.1+2.3)*Math.sin(fy*4.8+1.7)+0.15*Math.sin(fx*10+fy*8)+rng()*0.1),
    cropType:cl(0.5+0.3*Math.sin(fx*7+fy*5)+rng()*0.2),
  };
}

function nearDist(lng,lat) {
  return DISTRICTS.reduce((b,d)=>{
    const r=Math.hypot(lng-d.center[0],lat-d.center[1]);
    return r<b.r?{...d,r}:b;
  },{...DISTRICTS[0],r:Infinity});
}

function scoreColor(v) {
  const t=Math.max(0,Math.min(1,v/100));
  let r,g;
  if(t<0.5){r=Math.round(210+45*t*2);g=Math.round(80+140*t*2);}
  else{r=Math.round(255-155*(t-0.5)*2);g=Math.round(220+20*(t-0.5)*2);}
  return `rgb(${r},${g},50)`;
}

function parcelFill(p,mode) {
  if(mode==="landUse") return LU_COLORS[p.landUse]||"#888";
  if(mode==="cropType") return CT_COLORS[p.cropType]||"#888";
  if(mode==="district") return DI_COLORS[p.district]||"#888";
  return scoreColor({farmScore:p.farmScore,harvestHealth:p.harvestHealth,soilQuality:p.soilQuality}[mode]||0);
}

function generate(seed,gridSize) {
  const rng=mkRng(seed);
  const lngs=KOS.map(p=>p[0]),lats=KOS.map(p=>p[1]);
  const x0=Math.min(...lngs),x1=Math.max(...lngs);
  const y0=Math.min(...lats),y1=Math.max(...lats);
  const dx=(x1-x0)/gridSize,dy=(y1-y0)/gridSize;

  const seeds=[];
  for(let ix=0;ix<=gridSize;ix++) for(let iy=0;iy<=gridSize;iy++) {
    const lng=x0+ix*dx+(rng()-0.5)*dx*0.65;
    const lat=y0+iy*dy+(rng()-0.5)*dy*0.65;
    if(pip([lng,lat],KOS)) seeds.push([lng,lat]);
  }

  const M=0.35;
  const allPts=[...seeds,[x0-M,y0-M],[x1+M,y0-M],[x0-M,y1+M],[x1+M,y1+M]];
  const delaunay=d3.Delaunay.from(allPts);
  const voronoi=delaunay.voronoi([x0-M,y0-M,x1+M,y1+M]);

  const parcels=[];
  const cl=(v,lo=0,hi=100)=>Math.round(Math.min(hi,Math.max(lo,v)));

  for(let i=0;i<seeds.length;i++) {
    const cell=voronoi.cellPolygon(i);
    if(!cell||cell.length<4) continue;
    const clipped=clipSH(cell.slice(0,-1),KOS);
    if(clipped.length<3) continue;
    const cen=centroid(clipped);
    if(!pip(cen,KOS)) continue;
    const area=polyArea(clipped);
    if(area<0.00002) continue;

    const [lng,lat]=cen;
    const m=getMasks(lng,lat,rng);
    const n=rng();
    const dist=nearDist(lng,lat);

    const waterAccess=cl(m.density*60+n*40);
    const slopeRisk=cl((1-m.farmland)*80*(0.5+rng()*0.5));
    const farmlandProb=0.15+m.farmland*0.7+m.density*0.15;
    const isFarmland=farmlandProb>(0.46+rng()*0.14);
    const harvestHealth=cl(20+m.health*60+waterAccess*0.15-slopeRisk*0.25+n*10);
    const farmScore=cl(m.farmland*55+m.cropType*25+waterAccess*0.1+n*10);
    const soilQuality=cl(m.farmland*80+n*20);

    const luPool=isFarmland?["farmland","farmland","farmland","pasture","orchard","vineyard"]:["pasture","fallow","forest_edge","mixed"];
    const landUse=luPool[Math.floor(rng()*luPool.length)];
    const crops=DCROP[dist.name]||["wheat","corn"];
    const cropType=isFarmland?crops[Math.floor(rng()*crops.length)]:"pasture";

    const mLng=111320*Math.cos(lat*Math.PI/180);
    const mLat=111320;
    const areaHa=Math.round(area*mLng*mLat/1000)/10;
    const shapeType=area>0.003?"irregular-rect":area>0.001?"rectangular":"voronoi";
    const id=`KOS-${dist.name.slice(0,3).toUpperCase()}-${String(parcels.length).padStart(6,"0")}`;

    parcels.push({
      id,parcelIndex:parcels.length,district:dist.name,
      centroid:[Math.round(lng*10000)/10000,Math.round(lat*10000)/10000],
      areaHa,shapeType,landUse,cropType,isFarmland,farmScore,harvestHealth,
      soilQuality,waterAccess,slopeRisk,
      confidence:Math.round(Math.min(1,Math.max(0,1-slopeRisk/200-n*0.1))*100)/100,
      maskValues:{farmland:Math.round(m.farmland*100)/100,density:Math.round(m.density*100)/100,health:Math.round(m.health*100)/100,cropType:Math.round(m.cropType*100)/100},
      noise:{seed,jitter:Math.round(n*1000)/1000,rotation:Math.round((rng()-0.5)*1000)/100},
      labels:["synthetic","demo",isFarmland?"farmland":"non-arable"],
      geometry:[...clipped,clipped[0]],
    });
  }
  return parcels;
}

const W=700,H=520;
const lngs=KOS.map(p=>p[0]),lats=KOS.map(p=>p[1]);
const bx0=Math.min(...lngs)-0.04,bx1=Math.max(...lngs)+0.04;
const by0=Math.min(...lats)-0.04,by1=Math.max(...lats)+0.04;

function proj([lng,lat]) {
  return [(lng-bx0)/(bx1-bx0)*W,(by1-lat)/(by1-by0)*H];
}

function toPath(coords) {
  if(!coords||coords.length<3) return "";
  return "M "+coords.map(proj).map(([x,y])=>`${x.toFixed(2)},${y.toFixed(2)}`).join(" L ")+" Z";
}

let parcels=[];
let selectedId=null;
let colorMode="landUse";

function render() {
  const g=document.getElementById("parcelsG");
  g.innerHTML="";
  parcels.forEach(p=>{
    const d=toPath(p.geometry);
    if(!d) return;
    const path=document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d",d);
    path.setAttribute("fill",parcelFill(p,colorMode));
    path.setAttribute("fill-opacity",selectedId===p.id?"1":"0.82");
    path.setAttribute("stroke",selectedId===p.id?"#fff":"#1a2438");
    path.setAttribute("stroke-width",selectedId===p.id?"1.5":"0.4");
    path.style.cursor="pointer";
    path.addEventListener("click",()=>selectParcel(p));
    path.addEventListener("mouseenter",()=>{ path.setAttribute("fill-opacity","1"); });
    path.addEventListener("mouseleave",()=>{ path.setAttribute("fill-opacity",selectedId===p.id?"1":"0.82"); });
    g.appendChild(path);
  });

  const bPath=KOS.map(proj).map(([x,y])=>`${x.toFixed(2)},${y.toFixed(2)}`);
  document.getElementById("borderPath").setAttribute("d","M "+bPath.join(" L ")+" Z");

  const labG=document.getElementById("labelsG");
  labG.innerHTML="";
  DISTRICTS.forEach(d=>{
    const [sx,sy]=proj(d.center);
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",sx);t.setAttribute("y",sy);
    t.setAttribute("text-anchor","middle");t.setAttribute("dominant-baseline","middle");
    t.setAttribute("class","district-label");
    t.textContent=d.name.toUpperCase();
    labG.appendChild(t);
  });

  updateStats();
  updateLegend();
}

function updateStats() {
  const farm=parcels.filter(p=>p.isFarmland);
  const avgH=parcels.length?Math.round(parcels.reduce((s,p)=>s+p.harvestHealth,0)/parcels.length):0;
  const totalHa=Math.round(parcels.reduce((s,p)=>s+p.areaHa,0));
  document.getElementById("st-total").textContent=parcels.length;
  document.getElementById("st-farm").textContent=`${farm.length} (${parcels.length?Math.round(farm.length/parcels.length*100):0}%)`;
  document.getElementById("st-health").textContent=`${avgH}/100`;
  document.getElementById("st-area").textContent=`${totalHa.toLocaleString()} ha`;
}

function selectParcel(p) {
  selectedId=p.id;
  render();
  const panel=document.getElementById("infoPanel");
  panel.style.display="block";
  const scores=[
    {label:"Farm score",v:p.farmScore,color:"#4ade80"},
    {label:"Harvest health",v:p.harvestHealth,color:"#34d399"},
    {label:"Soil quality",v:p.soilQuality,color:"#a3e635"},
    {label:"Water access",v:p.waterAccess,color:"#38bdf8"},
    {label:"Slope risk",v:p.slopeRisk,color:"#fb923c"},
  ];
  document.getElementById("infoContent").innerHTML=`
    <div class="id-badge">${p.id}</div>
    <h3>Attributes</h3>
    <div class="attr-grid">
      <div class="attr-cell"><div class="ak">District</div><div class="av">${p.district}</div></div>
      <div class="attr-cell"><div class="ak">Area</div><div class="av">${p.areaHa} ha</div></div>
      <div class="attr-cell"><div class="ak">Land use</div><div class="av">${p.landUse}</div></div>
      <div class="attr-cell"><div class="ak">Crop</div><div class="av">${p.cropType}</div></div>
      <div class="attr-cell"><div class="ak">Shape</div><div class="av">${p.shapeType}</div></div>
      <div class="attr-cell"><div class="ak">Confidence</div><div class="av">${Math.round(p.confidence*100)}%</div></div>
      <div class="attr-cell"><div class="ak">Farmland?</div><div class="av" style="color:${p.isFarmland?"#4ade80":"#fb923c"}">${p.isFarmland?"Yes":"No"}</div></div>
      <div class="attr-cell"><div class="ak">Index</div><div class="av">#${p.parcelIndex}</div></div>
    </div>
    <h3>Scores</h3>
    ${scores.map(s=>`
    <div class="score-row">
      <div class="sr-top"><span class="sr-label">${s.label}</span><span class="sr-val">${s.v}</span></div>
      <div class="score-bar-bg"><div class="score-bar-fill" style="width:${s.v}%;background:${s.color}"></div></div>
    </div>`).join("")}
    <h3>Mask values</h3>
    <div class="mask-grid">
      ${Object.entries(p.maskValues).map(([k,v])=>`<div class="mask-cell"><span class="mask-key">${k}</span><span class="mask-val">${v}</span></div>`).join("")}
    </div>
    <h3>Centroid</h3>
    <div class="id-badge" style="font-size:10px">${p.centroid[0]}°E &nbsp; ${p.centroid[1]}°N</div>
    <h3>Labels</h3>
    <div class="tags">${p.labels.map(l=>`<span class="tag">${l}</span>`).join("")}</div>
    <h3>Noise</h3>
    <div class="mask-grid">
      <div class="mask-cell"><span class="mask-key">seed</span><span class="mask-val">${p.noise.seed}</span></div>
      <div class="mask-cell"><span class="mask-key">jitter</span><span class="mask-val">${p.noise.jitter}</span></div>
      <div class="mask-cell"><span class="mask-key">rotation</span><span class="mask-val">${p.noise.rotation}°</span></div>
    </div>
  `;
}

function updateLegend() {
  const legItems=document.getElementById("legItems");
  const legTitle=document.getElementById("legTitle");
  const titles={landUse:"Land use",cropType:"Crop type",district:"District",farmScore:"Farm score",harvestHealth:"Harvest health",soilQuality:"Soil quality"};
  legTitle.textContent=titles[colorMode];

  if(colorMode==="landUse") {
    legItems.innerHTML=Object.entries(LU_COLORS).map(([k,c])=>`<div class="legend-item"><div class="legend-swatch" style="background:${c}"></div>${k}</div>`).join("");
  } else if(colorMode==="cropType") {
    legItems.innerHTML=Object.entries(CT_COLORS).map(([k,c])=>`<div class="legend-item"><div class="legend-swatch" style="background:${c}"></div>${k}</div>`).join("");
  } else if(colorMode==="district") {
    legItems.innerHTML=Object.entries(DI_COLORS).map(([k,c])=>`<div class="legend-item"><div class="legend-swatch" style="background:${c}"></div>${k}</div>`).join("");
  } else {
    legItems.innerHTML=`<div class="legend-item"><div class="legend-grad" style="background:linear-gradient(to right,rgb(210,80,50),rgb(255,220,50),rgb(100,240,50))"></div><span style="font-size:11px;color:var(--color-text-secondary)">0 → 100</span></div>`;
  }
}

function regenWithSeed() {
  const s=parseInt(document.getElementById("seedInput").value)||918273;
  const g=parseInt(document.getElementById("gridSel").value)||28;
  parcels=generate(s,g);
  selectedId=null;
  document.getElementById("infoPanel").style.display="none";
  render();
}

document.getElementById("regenBtn").addEventListener("click",regenWithSeed);
document.getElementById("seedInput").addEventListener("keydown",e=>{ if(e.key==="Enter") regenWithSeed(); });
document.getElementById("colorSel").addEventListener("change",e=>{ colorMode=e.target.value; render(); });
document.getElementById("closeBtn").addEventListener("click",()=>{ selectedId=null; document.getElementById("infoPanel").style.display="none"; render(); });

document.getElementById("exportBtn").addEventListener("click",()=>{
  const fc={
    type:"FeatureCollection",
    generatedBy:"Kosovo Cadastral Demo — synthetic data",
    seed:parseInt(document.getElementById("seedInput").value)||918273,
    features:parcels.map(p=>({
      type:"Feature",
      properties:(({geometry,...rest})=>rest)(p),
      geometry:{type:"Polygon",coordinates:[p.geometry]},
    })),
  };
  const blob=new Blob([JSON.stringify(fc,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`kosovo-parcels-seed${fc.seed}.geojson`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});

regenWithSeed();
</script>
</body>
</html>
